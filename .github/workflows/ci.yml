name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "file:./prisma/ci.db"
          BETTER_AUTH_SECRET: "ci-only-secret-that-is-at-least-32-chars"
          BETTER_AUTH_URL: "http://127.0.0.1:5000"
          FRONTEND_URL: "http://127.0.0.1:5173"

      - name: Test
        run: pnpm test
